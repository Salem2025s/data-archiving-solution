name: Cycle de vie — réentraînement automatique

# C5.3.4 — Automatiser le cycle de vie : collecte de nouvelles données,
# réentraînement d'un modèle candidat, et promotion SOUS non-régression.
#
# En CI, les données réelles (dataset enrichi 38 Mo, modèle .joblib) ne sont pas
# présentes → le job tourne en MODE DÉMONSTRATION sur un jeu SYNTHÉTIQUE au schéma
# métier (clairement étiqueté). Le MÉCANISME — candidat vs production, règle de
# non-régression, décision de promotion — est identique en production, où il est
# branché sur les vraies tables + corrections de revue collectées.

on:
  workflow_dispatch:          # bouton « Run workflow »
  schedule:
    - cron: "0 3 1 * *"       # mensuel : 1er du mois, 03:00 UTC

jobs:
  collecte-et-reentrainement:
    name: Collecte + réentraînement (non-régression)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-learn>=1.4.0" "numpy" "pandas" "scipy>=1.11.0" "joblib>=1.3.0"

      # C5.3.4 — le cycle : collecte (nouveau lot) → candidat → évaluation →
      # promotion seulement si non-régression (tolérance 0,01 de macro-F1).
      - name: Réentraîner et décider (non-régression)
        run: python -m scripts.retrain_pipeline --synthetic

      - name: Publier la décision et le candidat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-decision
          path: |
            artifacts/retrain_decision.json
            artifacts/candidate_model.joblib
            artifacts/retrain_registry.jsonl
          if-no-files-found: warn
          retention-days: 90
