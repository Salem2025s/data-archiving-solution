name: CI/CD

# Intégration continue + étapes de release (CD) — couvre les 4 automatisations
# exigées par C5.3.2 (registre · tests · évaluation des performances · déploiement).
#
# CI  (à chaque push / PR sur main) : lint (advisory) + tests + garde-fou de parité.
# CD  (push sur main uniquement)    : état du registre de modèles, gate de performance
#                                     bloquant, build de l'image Docker de production.
# Les tests tournent SANS base de données (isolés, déterministes) : aucun service externe.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # déclenchement manuel (bouton « Run workflow » de l'onglet Actions)

jobs:
  test:
    name: Lint & tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Lint purement indicatif : `--exit-zero` rapporte les soucis de style dans
      # les logs sans faire échouer l'étape (aucune annotation rouge). Le vrai
      # garde-fou reste la suite de tests ci-dessous.
      - name: Lint (ruff — advisory, non bloquant)
        run: |
          pip install ruff
          ruff check src/ scripts/ tests/ --exit-zero

      - name: Run tests (pytest — gate)
        run: pytest

      - name: Regression guard — train/inférence parity
        run: pytest tests/test_score_features.py -q

  # ---------------------------------------------------------------------------
  # Release (CD) — ne s'exécute que si les tests passent, sur push main.
  # Enchaîne les 3 briques de déploiement manquantes du processus CI/CD.
  # ---------------------------------------------------------------------------
  package:
    name: Release — registre · performance · image Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # C5.3.2 (1) — enregistrement du modèle dans un registre versionné
      - name: Registre de modèles — état
        run: python -m scripts.register_model --list

      # C5.3.2 (3) — évaluation automatisée des performances (gate bloquant)
      - name: Gate de performance du modèle de production
        run: python -m scripts.check_model_performance

      # C5.3.2 (4) — déploiement : build de l'image de production containerisée
      - name: Build de l'image Docker
        run: docker build -t data-archiving-solution:ci .
